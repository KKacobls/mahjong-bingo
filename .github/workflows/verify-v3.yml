name: Verify v3 Single Wait
on:
  push:
    branches: ['feature/v3-single-wait-keep-one-line', main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Check standalone markup
        run: node --test tests/v3-bonus.test.mjs
